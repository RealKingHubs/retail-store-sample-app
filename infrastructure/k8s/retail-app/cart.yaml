apiVersion: v1
kind: ConfigMap
metadata:
  name: cart-config
  namespace: retail-app
data:
  RETAIL_CART_PERSISTENCE_PROVIDER: "dynamodb"
  RETAIL_CART_PERSISTENCE_DYNAMODB_TABLENAME: "retailstore-cart"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart
  namespace: retail-app
  labels:
    app: cart
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cart
  template:
    metadata:
      labels:
        app: cart
    spec:
      serviceAccountName: cart-service-account
      securityContext:
        fsGroup: 1000
      containers:
        - name: cart
          image: public.ecr.aws/aws-containers/retail-store-sample-cart:0.8.5
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: JAVA_OPTS
              value: "-XX:MaxRAMPercentage=75.0 -Djava.security.egd=file:/dev/urandom"
          envFrom:
            - configMapRef:
                name: cart-config 
          securityContext:
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 256m
              memory: 512Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - mountPath: /tmp
              name: tmp-volume
      volumes:
        - name: tmp-volume
          emptyDir:
            medium: Memory
---
apiVersion: v1
kind: Service
metadata:
  name: cart
  namespace: retail-app
spec:
  selector:
    app: cart
  ports:
    - port: 80
      targetPort: 8080